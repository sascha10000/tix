<!DOCTYPE html>
<html lang="{{ t.lang_code }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ticket System{% endblock %}</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem("theme")||"light";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="/" class="nav-brand">tix<span class="brand-dot">.</span></a>
            <div class="nav-sep"></div>
            <a href="/projects">{{ t.nav.projects }}</a>
            {% if user.is_admin() %}
            <a href="/admin/users">{{ t.nav.users }}</a>
            <a href="/admin/statuses">{{ t.nav.statuses }}</a>
            <a href="/admin/ticket-types">{{ t.nav.types }}</a>
            {% endif %}
        </div>
        <div class="nav-right">
            <button class="theme-toggle" onclick="(function(){var t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t)})()" aria-label="{{ t.nav.toggle_theme }}">
                <svg class="theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="theme-icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            </button>
            <div class="nav-sep"></div>
            <a href="/profile" class="nav-user">{{ user.username }}{% if user.is_admin %} <span class="nav-role">{{ t.nav.admin_role }}</span>{% endif %}</a>
            <form method="post" action="/logout" style="display:inline">
                <button type="submit" class="btn btn-sm btn-ghost">{{ t.nav.logout }}</button>
            </form>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <div id="notify-texts" hidden
         data-created="{{ t.notifications.browser_created }}"
         data-assigned="{{ t.notifications.browser_assigned }}"></div>
    <script>
    // Desktop notifications for tickets created for / assigned to the current user.
    // Only active after the user granted permission (button on the profile page).
    window.ticketNotifications = (function () {
        var KEY = "notifyLastId", INTERVAL_MS = 60000, timer = null;
        var texts = document.getElementById("notify-texts").dataset;
        function poll() {
            var after = null;
            try { after = localStorage.getItem(KEY); } catch (e) {}
            var url = "/notifications" + (after ? "?after=" + encodeURIComponent(after) : "");
            fetch(url, { credentials: "same-origin", headers: { "Accept": "application/json" } })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data) return;
                    if (after) {
                        data.items.forEach(function (n) {
                            var title = n.kind === "assigned" ? texts.assigned : texts.created;
                            var note = new Notification(title, {
                                body: n.title + " \u2014 " + n.project + (n.actor ? " (" + n.actor + ")" : ""),
                                tag: "ticket-" + n.ticket_id
                            });
                            note.onclick = function () {
                                window.focus();
                                location.href = "/projects/" + n.project_id + "/tickets/" + n.ticket_id;
                            };
                        });
                    }
                    try { localStorage.setItem(KEY, String(data.latest_id)); } catch (e) {}
                })
                .catch(function () {});
        }
        function start() {
            if (timer || !("Notification" in window) || Notification.permission !== "granted") return;
            poll();
            timer = setInterval(poll, INTERVAL_MS);
        }
        start();
        return { start: start };
    })();
    </script>
</body>
</html>
