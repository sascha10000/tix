name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --workspace builds all crates together so the language features of
      # ticketsystem-core are enabled (it does not compile on its own).
      - name: Run tests
        run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Statically linked (musl): runs on any x86_64 Linux, independent of glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ticketsystem-linux-x64
            smoke-test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ticketsystem-windows-x64
            smoke-test: true
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ticketsystem-macos-aarch64
            smoke-test: true
          # Cross-compiled for Intel Macs on the Apple Silicon runner.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ticketsystem-macos-x64
            smoke-test: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The bundled SQLite is C code and needs a musl C compiler.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static linking
        if: contains(matrix.target, 'musl')
        run: |
          file target/${{ matrix.target }}/release/ticketsystem
          file target/${{ matrix.target }}/release/ticketsystem | grep -q "static"

      - name: Smoke test binary
        if: matrix.smoke-test
        shell: bash
        run: target/${{ matrix.target }}/release/ticketsystem --help

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ matrix.artifact }}.tar.gz -C target/${{ matrix.target }}/release ticketsystem -C ${{ github.workspace }} .env.example

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          7z a ${{ matrix.artifact }}.zip target/${{ matrix.target }}/release/ticketsystem.exe .env.example

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
