[package]
name = "ticketsystem-web"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ticketsystem"
path = "src/main.rs"

[features]
default = ["admin", "migrations", "lang-all", "tls"]
admin = []
# Native HTTPS support (enabled at runtime via TLS_CERT_FILE / TLS_KEY_FILE).
tls = ["dep:rustls", "actix-web/rustls-0_23"]
lang-all = ["lang-de", "lang-en", "lang-es"]
migrations = ["ticketsystem-db/migrations"]
lang-en = ["ticketsystem-core/lang-en"]
lang-de = ["ticketsystem-core/lang-de"]
lang-es = ["ticketsystem-core/lang-es"]

[dependencies]
ticketsystem-core = { path = "../core", default-features = false }
ticketsystem-auth = { path = "../auth" }
ticketsystem-db = { path = "../db" }
actix-web = "4"
askama = "0.12"
askama_actix = "0.14"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde_json = "1"
url = "2"
# `ring` instead of the default aws-lc-rs backend: no CMake/C toolchain
# requirements, so the musl and Windows release builds stay simple.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# SMTP for notification e-mails: rustls with ring + bundled Mozilla roots (works in the
# static musl build without system certificates). No connection pool: actix runs one
# Tokio runtime per worker, and pooled sockets must not cross runtimes.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
